name: Protocol tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-01-16 --profile minimal
      - name: Test protocol
        run: cargo +nightly-2026-01-16 test --manifest-path tests/Cargo.toml --locked
